name: Sync Upstream

on:
  schedule:
    # GitHub may delay scheduled workflows during busy periods. Poll every
    # three hours so an upstream release is not missed for an entire day when
    # it lands shortly after one delayed run.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SYNC_BRANCH: sync/upstream-main
      UPSTREAM_REPOSITORY: jlcodes99/cockpit-tools
    steps:
      - name: Checkout Clean main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js for Clean merge drivers and checks
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git merge identity and Clean merge rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.keep-clean.driver true
          git config merge.clean-tauri-config.name "merge upstream Tauri config while preserving Clean identity and updater"
          git config merge.clean-tauri-config.driver "node scripts/merge-clean-tauri-config.cjs %O %A %B %L %P"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Merge upstream into a review branch
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Clean main already contains the latest upstream commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git switch -C "${SYNC_BRANCH}" origin/main
          if ! git merge --no-ff --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ', ' -)"
            git merge --abort
            echo "Upstream merge needs manual conflict resolution: ${conflicts}" >> "$GITHUB_STEP_SUMMARY"

            if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')" = "true" ]; then
              existing_issue="$(gh issue list --state open --search 'Upstream sync needs manual resolution in:title' --json number --jq '.[0].number // empty')"
              if [ -z "${existing_issue}" ]; then
                gh issue create \
                  --title "Upstream sync needs manual resolution" \
                  --body "The scheduled merge from \`${UPSTREAM_REPOSITORY}:main\` conflicted with Clean changes. Conflicting files: ${conflicts}. No change was pushed to \`main\`."
              else
                gh issue comment "${existing_issue}" \
                  --body "The latest scheduled sync still conflicts. Conflicting files: ${conflicts}."
              fi
            else
              echo "::error title=Upstream sync needs manual resolution::Conflicting files: ${conflicts}. Repository Issues are disabled, so no issue was created."
            fi
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Run Clean edition regression gate
        if: steps.merge.outputs.changed == 'true'
        run: node scripts/verify-clean-edition.cjs

      - name: Push validated merge to main
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin "HEAD:refs/heads/main"

      - name: Ensure the current Clean version is fully released
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          check_dir="$(mktemp -d)"
          manifest_version=""
          release_run_count="$(
            gh run list \
              --workflow release.yml \
              --commit "$(git rev-parse HEAD)" \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status != "completed")] | length'
          )"

          if gh release view "${tag}" > /dev/null 2>&1 && \
             gh release download "${tag}" --pattern latest.json --dir "${check_dir}" --clobber > /dev/null 2>&1; then
            manifest_version="$(jq -r '.version // empty' "${check_dir}/latest.json")"
          fi

          if [ "${manifest_version}" = "${version}" ]; then
            echo "Clean release ${tag} already has a complete updater manifest." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${release_run_count}" -gt 0 ]; then
            echo "Clean release ${tag} is already queued or building; no duplicate release was dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run release.yml --ref main
            echo "Dispatched Clean release ${tag}; existing updater manifest version was '${manifest_version:-missing}'." >> "$GITHUB_STEP_SUMMARY"
          fi
